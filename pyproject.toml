[project]
name = "esc50-sound-classification-cnn"
version = "1.0.0"
description = "Environmental sound classification on ESC-50 with a log-mel spectrogram CNN (TensorFlow/Keras)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tensorflow>=2.16,<2.22",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[dependency-groups]
notebook = ["jupyter>=1.0"]

[tool.uv]
package = false
default-groups = []
